components:
  schemas:
    Assignment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        pharmacy:
          type: integer
        is_active:
          type: boolean
      required:
      - id
      - is_active
      - pharmacy
      - user
    CartChange:
      type: object
      properties:
        product_id:
          type: integer
          minimum: 1
        quantity:
          type: integer
          maximum: 10000
          minimum: 0
      required:
      - product_id
      - quantity
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    DeliveryRule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        method:
          $ref: '#/components/schemas/FulfillmentMethodEnum'
        requires_cold_chain:
          type: boolean
        cold_chain_supported:
          type: boolean
        enabled:
          type: boolean
        max_storage_min_c:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        min_storage_max_c:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
      required:
      - cold_chain_supported
      - enabled
      - id
      - method
      - requires_cold_chain
    FulfillmentMethodEnum:
      enum:
      - PICKUP
      - COURIER
      - POSTAL
      type: string
      description: |-
        * `PICKUP` - PICKUP
        * `COURIER` - COURIER
        * `POSTAL` - POSTAL
    Line:
      type: object
      properties:
        product_id:
          type: integer
          minimum: 1
        quantity:
          type: integer
          maximum: 10000
          minimum: 1
        expected_unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - product_id
      - quantity
    Login:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - password
      - username
    Manufacturer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 160
      required:
      - id
      - name
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        order_number:
          type: string
          maxLength: 36
        customer_id:
          type: integer
          readOnly: true
        pharmacy_id:
          type: integer
          readOnly: true
        status:
          type: string
          maxLength: 32
        fulfillment_method:
          type: string
          maxLength: 16
        payment_method:
          type: string
          maxLength: 32
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        discount_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        shipping_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        grand_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        currency:
          type: string
          maxLength: 3
        created_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - created_at
      - currency
      - customer_id
      - discount_total
      - fulfillment_method
      - grand_total
      - id
      - items
      - order_number
      - payment_method
      - pharmacy_id
      - shipping_total
      - status
      - subtotal
    PaginatedAssignmentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
    PaginatedCategoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
